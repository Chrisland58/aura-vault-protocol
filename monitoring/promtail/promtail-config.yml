server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: aura-vault
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

# ── Kubernetes Service Discovery ─────────────────────────────────────────────
scrape_configs:

  # ── Kubernetes Pod Logs (primary — DaemonSet) ──────────────────────────────
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only scrape pods with annotation promtail.io/scrape: "true" OR all pods
      - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
        action: drop
        regex: "false"
      # Map pod namespace → label
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      # Map pod name → label
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # Map container name → label
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      # Map node name → label
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      # Map app label → service label
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      # Map environment from namespace or label
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      # Fallback environment from namespace prefix
      - source_labels: [namespace]
        regex: "(staging|production|development|dev|prod|stg).*"
        target_label: environment
        replacement: "$1"
      # Build log path from pod UID and container name
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      # Keep job name as kubernetes-pods
      - target_label: job
        replacement: kubernetes-pods

    pipeline_stages:
      # ── Auto-detect CRI format (containerd vs docker) ──────────────────────
      - cri: {}

      # ── Parse JSON logs if present ─────────────────────────────────────────
      - json:
          expressions:
            level: level
            msg: message
            ts: timestamp
            err: error
          drop_malformed: false

      # ── Promote log level label ────────────────────────────────────────────
      - labels:
          level:
          service:

      # ── Timestamp extraction ───────────────────────────────────────────────
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z07:00"
            - UnixMs

      # ── Mask sensitive fields ──────────────────────────────────────────────
      # Passwords
      - replace:
          expression: '(?i)(password["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      # JWT tokens (Bearer and raw)
      - replace:
          expression: '(?i)(bearer\s+)[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+'
          replace: '${1}[JWT_REDACTED]'
      - replace:
          expression: '(?i)(authorization["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      # API keys / tokens
      - replace:
          expression: '(?i)(api[_\-]?key["\s:=]+|token["\s:=]+|secret["\s:=]+|access[_\-]?key["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      # Private keys / mnemonics
      - replace:
          expression: '(?i)(private[_\-]?key["\s:=]+|mnemonic["\s:=]+|seed["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      # Database connection strings
      - replace:
          expression: '(?i)(postgres(?:ql)?://[^:]+:)[^@]+'
          replace: '${1}[REDACTED]@'
      - replace:
          expression: '(?i)(redis://[^:]*:)[^@\s]+'
          replace: '${1}[REDACTED]@'
      # Credit cards (basic pattern)
      - replace:
          expression: '\b(?:\d[ -]?){13,16}\b'
          replace: '[CARD_REDACTED]'

      # ── Drop noisy health check / readiness probe logs ─────────────────────
      - drop:
          expression: '.*(GET /health|GET /healthz|GET /readiness|GET /liveness|GET /ping|kube-probe).*'
          drop_counter_reason: health_check

  # ── Frontend Service (Next.js) ─────────────────────────────────────────────
  - job_name: frontend
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: "frontend|aura-frontend"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      - target_label: service
        replacement: frontend
      - target_label: job
        replacement: frontend

    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            msg: message
            ts: time
            url: url
            method: method
            statusCode: statusCode
          drop_malformed: false
      - labels:
          level:
          method:
          statusCode:
      - replace:
          expression: '(?i)(authorization["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - replace:
          expression: '(?i)(token["\s:=]+|session["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - drop:
          expression: '.*(GET /health|GET /_next/static|GET /favicon).*'
          drop_counter_reason: noise

  # ── Backend Service (TypeScript/Express) ──────────────────────────────────
  - job_name: backend
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: "backend|aura-backend|aura-api"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      - target_label: service
        replacement: backend
      - target_label: job
        replacement: backend

    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            msg: message
            ts: timestamp
            err: error
            method: method
            path: path
            statusCode: statusCode
            duration: duration
            userId: userId
          drop_malformed: false
      - labels:
          level:
          method:
      - replace:
          expression: '(?i)(password["\s:=]+|passwd["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - replace:
          expression: '(?i)(authorization["\s:=]+|bearer\s+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - replace:
          expression: '(?i)(jwt["\s:=]+|token["\s:=]+|secret["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - replace:
          expression: '(?i)(private[_\-]?key["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - job_name: postgres
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: "postgres|postgresql"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      - target_label: service
        replacement: postgres
      - target_label: job
        replacement: postgres

    pipeline_stages:
      - cri: {}
      # Parse postgres log format: YYYY-MM-DD HH:MM:SS UTC [pid] USER@DB LEVEL: message
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)? \w+) \[(?P<pid>\d+)\] (?P<user>[^@]*)@(?P<db>\S*) (?P<level>\w+):  (?P<msg>.*)'
      - labels:
          level:
          db:
      - timestamp:
          source: ts
          format: "2006-01-02 15:04:05 MST"
      # Mask postgres passwords in logs
      - replace:
          expression: '(?i)(password["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      # Drop routine checkpoint/autovacuum noise
      - drop:
          expression: '.*(checkpoint complete|automatic vacuum|automatic analyze|pg_catalog).*'
          drop_counter_reason: pg_noise

  # ── Redis ──────────────────────────────────────────────────────────────────
  - job_name: redis
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: "redis"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      - target_label: service
        replacement: redis
      - target_label: job
        replacement: redis

    pipeline_stages:
      - cri: {}
      # Parse redis log: pid:role timestamp loglevel message
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>[CMSX]) (?P<ts>\d{2} \w+ \d{4} \d{2}:\d{2}:\d{2}\.\d+) (?P<level>[.*#-]) (?P<msg>.*)'
      - labels:
          level:
      # Mask AUTH commands
      - replace:
          expression: '(?i)(auth\s+)[^\s]+'
          replace: '${1}[REDACTED]'
      # Drop PING/PONG keepalives
      - drop:
          expression: '.*(PING|PONG|Command processed|Background saving started).*'
          drop_counter_reason: redis_noise

  # ── Contract Indexer ───────────────────────────────────────────────────────
  - job_name: contract-indexer
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: "contract-indexer|indexer|aura-indexer"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_environment]
        target_label: environment
      - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
        separator: /
        replacement: /var/log/pods/*$1/$2/*.log
      - target_label: service
        replacement: contract-indexer
      - target_label: job
        replacement: contract-indexer

    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            msg: message
            ts: timestamp
            blockHeight: blockHeight
            txHash: txHash
            contractId: contractId
          drop_malformed: false
      - labels:
          level:
          contractId:
      - replace:
          expression: '(?i)(private[_\-]?key["\s:=]+|secret["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'

  # ── Docker Compose fallback (local dev / docker-compose.monitoring.yml) ────
  - job_name: docker-compose-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-compose
          environment: development
          __path__: /var/log/containers/*.log

    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            msg: message
            ts: timestamp
          drop_malformed: false
      - labels:
          level:
      - replace:
          expression: '(?i)(password["\s:=]+|token["\s:=]+|secret["\s:=]+|authorization["\s:=]+)[^\s,"}]+'
          replace: '${1}[REDACTED]'
      - drop:
          expression: '.*(GET /health|GET /ping).*'
          drop_counter_reason: health_check

  # ── System / node logs ─────────────────────────────────────────────────────
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          environment: production
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\w+ +\d+ \d{2}:\d{2}:\d{2}) (?P<host>\S+) (?P<service>\S+)(\[\d+\])?: (?P<msg>.*)'
      - labels:
          service:
          host:

# Docker Compose — Integration Test Environment
#
# Acceptance Criteria:
#   ✅ Docker Compose test environment with PostgreSQL + Redis
#   ✅ Tests run in CI using docker compose up -d
#   ✅ Database seeded with known state before each test
#   ✅ Database cleaned up after each test suite
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && DATABASE_URL=... vitest run src/routes/__tests__/integration.postgres.test.ts
#   docker compose -f docker-compose.test.yml down -v

version: "3.8"

services:
  # ── PostgreSQL — integration test database ─────────────────────
  postgres-test:
    image: postgres:15-alpine
    container_name: aura-postgres-test
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: aura_test
      POSTGRES_PASSWORD: aura_test_password
      POSTGRES_DB: aura_vault_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U aura_test -d aura_vault_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aura-test-network

  # ── Redis — integration test cache ────────────────────────────
  redis-test:
    image: redis:7-alpine
    container_name: aura-redis-test
    restart: "no"
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aura-test-network

  # ── Backend (test mode) ────────────────────────────────────────
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aura-backend-test
    restart: "no"
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: test
      PORT: 3001
      JWT_SECRET: integration-test-secret-do-not-use-in-production
      REDIS_URL: redis://redis-test:6379
      DATABASE_URL: postgres://aura_test:aura_test_password@postgres-test:5432/aura_vault_test
      # No replica in test — read pool falls back to primary
      VAULT_CONTRACT_ID: CAURA_VAULT_TEST_INTEGRATION
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - aura-test-network

volumes:
  postgres_test_data:
    driver: local

networks:
  aura-test-network:
    driver: bridge

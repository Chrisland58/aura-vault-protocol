<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="No wallet connected illustration" focusable="false" fill="none">
  <!-- Wallet body -->
  <rect x="30" y="48" width="120" height="72" rx="10" fill="#1a1d27" stroke="#9fa8c7" stroke-width="2"/>
  <!-- Wallet flap/header -->
  <rect x="30" y="48" width="120" height="28" rx="10" fill="#22263a" stroke="#9fa8c7" stroke-width="2"/>
  <rect x="30" y="62" width="120" height="14" fill="#22263a"/>
  <!-- Card slot -->
  <rect x="100" y="58" width="38" height="22" rx="6" fill="#0f1117" stroke="#7c83fd" stroke-width="1.5"/>
  <!-- Coin inside slot -->
  <circle cx="119" cy="69" r="6" fill="#0f1117" stroke="#7c83fd" stroke-width="1.5"/>
  <line x1="119" y1="65" x2="119" y2="73" stroke="#7c83fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="69" x2="123" y2="69" stroke="#7c83fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Disconnected plug left side -->
  <rect x="40" y="92" width="28" height="10" rx="4" fill="#22263a" stroke="#9fa8c7" stroke-width="1.5"/>
  <line x1="44" y1="102" x2="44" y2="108" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="102" x2="56" y2="108" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Gap (break in connection) -->
  <line x1="68" y1="105" x2="76" y2="105" stroke="#f28b82" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <!-- Disconnected plug right side -->
  <rect x="76" y="100" width="28" height="10" rx="4" fill="#22263a" stroke="#9fa8c7" stroke-width="1.5"/>
  <line x1="80" y1="100" x2="80" y2="94" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="100" x2="92" y2="94" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Warning indicator -->
  <circle cx="154" cy="100" r="14" fill="#0f1117" stroke="#ffb74d" stroke-width="2"/>
  <line x1="154" y1="93" x2="154" y2="103" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="154" cy="108" r="1.5" fill="#ffb74d"/>
  <!-- Small sparkle dots -->
  <circle cx="170" cy="44" r="2" fill="#7c83fd" opacity="0.4"/>
  <circle cx="26" cy="130" r="2.5" fill="#7c83fd" opacity="0.3"/>
  <circle cx="178" cy="130" r="1.5" fill="#4caf84" opacity="0.35"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Error state illustration" focusable="false" fill="none">
  <!-- Main alert triangle -->
  <path d="M100 24 L174 140 H26 Z" fill="#1a1d27" stroke="#f28b82" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner softer triangle -->
  <path d="M100 40 L162 132 H38 Z" fill="#22263a" stroke="#ffffff08" stroke-width="1"/>
  <!-- Exclamation mark body -->
  <rect x="96" y="64" width="8" height="36" rx="3" fill="#f28b82"/>
  <!-- Exclamation mark dot -->
  <circle cx="100" cy="114" r="5" fill="#f28b82"/>
  <!-- Broken circuit lines radiating out -->
  <line x1="26" y1="140" x2="14" y2="148" stroke="#f28b82" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="174" y1="140" x2="186" y2="148" stroke="#f28b82" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="100" y1="24" x2="100" y2="12" stroke="#f28b82" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Small circuit nodes (visual detail, not info-bearing) -->
  <circle cx="14" cy="150" r="2.5" fill="#f28b82" opacity="0.4"/>
  <circle cx="186" cy="150" r="2.5" fill="#f28b82" opacity="0.4"/>
  <circle cx="100" cy="10" r="2.5" fill="#f28b82" opacity="0.35"/>
  <!-- Glow halo on triangle -->
  <path d="M100 24 L174 140 H26 Z" stroke="#f28b82" stroke-width="6" opacity="0.07" stroke-linejoin="round"/>
  <!-- Decorative small diamonds -->
  <path d="M170 50 l4 4 -4 4 -4 -4 Z" fill="#ffb74d" opacity="0.4"/>
  <path d="M28 50 l3 3 -3 3 -3 -3 Z" fill="#7c83fd" opacity="0.35"/>
</svg>

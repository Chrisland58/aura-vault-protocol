<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Vault paused illustration" focusable="false" fill="none">
  <!-- Vault door outer ring -->
  <circle cx="100" cy="80" r="54" fill="#1a1d27" stroke="#9fa8c7" stroke-width="2"/>
  <!-- Vault door face -->
  <circle cx="100" cy="80" r="42" fill="#22263a" stroke="#7c83fd" stroke-width="2"/>
  <!-- Inner ring detail -->
  <circle cx="100" cy="80" r="30" fill="#1a1d27" stroke="#ffffff18" stroke-width="1"/>
  <!-- Handle spokes (6 bolts) -->
  <line x1="100" y1="38" x2="100" y2="50" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="100" y2="122" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="59" x2="71" y2="64.5" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="129" y1="95.5" x2="138" y2="101" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="101" x2="71" y2="95.5" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="129" y1="64.5" x2="138" y2="59" stroke="#9fa8c7" stroke-width="3" stroke-linecap="round"/>
  <!-- Centre handle wheel -->
  <circle cx="100" cy="80" r="10" fill="#22263a" stroke="#7c83fd" stroke-width="2"/>
  <!-- Pause icon in centre (two vertical bars) -->
  <rect x="94" y="72" width="4" height="16" rx="1.5" fill="#ffb74d"/>
  <rect x="102" y="72" width="4" height="16" rx="1.5" fill="#ffb74d"/>
  <!-- Lock shackle (padlock arc, top-right of vault) -->
  <path d="M148 62 A14 14 0 0 0 148 46" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="138" y="62" width="20" height="16" rx="4" fill="#1a1d27" stroke="#ffb74d" stroke-width="2"/>
  <circle cx="148" cy="70" r="3" fill="#ffb74d"/>
  <!-- Subtle glow ring -->
  <circle cx="100" cy="80" r="54" stroke="#ffb74d" stroke-width="1" opacity="0.18"/>
  <!-- Corner dots -->
  <circle cx="28" cy="28" r="2" fill="#7c83fd" opacity="0.35"/>
  <circle cx="172" cy="134" r="2" fill="#7c83fd" opacity="0.35"/>
</svg>

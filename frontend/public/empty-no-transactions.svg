<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="No transactions illustration" focusable="false" fill="none">
  <!-- Background card -->
  <rect x="20" y="28" width="160" height="104" rx="12" fill="#1a1d27" stroke="#ffffff18" stroke-width="1.5"/>
  <!-- Card highlight lines (stacked receipts) -->
  <rect x="36" y="44" width="128" height="72" rx="8" fill="#22263a"/>
  <rect x="44" y="52" width="112" height="56" rx="6" fill="#1a1d27" stroke="#7c83fd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Receipt lines suggesting empty rows -->
  <line x1="56" y1="68" x2="100" y2="68" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="80" x2="88" y2="80" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="56" y1="92" x2="94" y2="92" stroke="#9fa8c7" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Amount columns (right) -->
  <line x1="120" y1="68" x2="140" y2="68" stroke="#7c83fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="136" y2="80" stroke="#7c83fd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="120" y1="92" x2="138" y2="92" stroke="#7c83fd" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Magnifier circle (nothing found) -->
  <circle cx="148" cy="112" r="18" fill="#0f1117" stroke="#4caf84" stroke-width="2"/>
  <line x1="157" y1="121" x2="166" y2="130" stroke="#4caf84" stroke-width="2.5" stroke-linecap="round"/>
  <!-- X inside magnifier -->
  <line x1="142" y1="106" x2="154" y2="118" stroke="#4caf84" stroke-width="2" stroke-linecap="round"/>
  <line x1="154" y1="106" x2="142" y2="118" stroke="#4caf84" stroke-width="2" stroke-linecap="round"/>
  <!-- Small decorative dots -->
  <circle cx="34" cy="20" r="3" fill="#7c83fd" opacity="0.4"/>
  <circle cx="44" cy="14" r="2" fill="#4caf84" opacity="0.3"/>
  <circle cx="166" cy="18" r="2.5" fill="#7c83fd" opacity="0.3"/>
</svg>

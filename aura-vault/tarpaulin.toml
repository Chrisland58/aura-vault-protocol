# Tarpaulin coverage configuration for the Aura Vault smart contract.
# Thresholds are enforced here so CI YAML never needs to be updated for threshold changes.

[default]
# Run only unit/integration tests (no fuzzing targets)
test-threads = 4

# Output formats: JSON for the PR delta script, Lcov for tooling, stdout for CI logs
out = ["Json", "Lcov", "Stdout"]
output-dir = "../coverage/smart-contract"

# Exclude test modules and generated code from coverage calculation
exclude-files = [
    "src/test.rs",
    "src/fuzz.rs",
    "src/fuzz_properties.rs",
]

# Fail the tarpaulin run when line coverage drops below this percentage.
# Change this value to adjust the threshold — no CI YAML edit required.
fail-under = 90.0

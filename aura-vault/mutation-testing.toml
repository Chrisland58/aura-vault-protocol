# cargo-mutants configuration for AuraVault smart contract
# Run with: cargo mutants --workspace

[mutants]
# Focus on critical contract logic
include_globs = ["src/lib.rs", "src/errors.rs", "src/storage.rs", "src/fee.rs"]
exclude_globs = ["src/test.rs", "src/**/*_test.rs", "src/proptest_strategies.rs", "src/fuzz*.rs"]

# Timeout per mutant (seconds) - Soroban tests can be slow
timeout = 120

# Output directory for reports
output = "mutants.out"

name: PR Checks

on:
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path aura-vault/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path aura-vault/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --manifest-path aura-vault/Cargo.toml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --manifest-path aura-vault/Cargo.toml

  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Wasm
        run: cargo build --manifest-path aura-vault/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Check Wasm size
        run: |
          WASM=aura-vault/target/wasm32-unknown-unknown/release/aura_vault.wasm
          SIZE=$(wc -c < "$WASM")
          echo "Wasm size: ${SIZE} bytes"
          # Soroban max contract size is 65536 bytes (64 KiB)
          if [ "$SIZE" -gt 65536 ]; then
            echo "ERROR: Wasm binary exceeds 64 KiB Soroban limit"
            exit 1
          fi

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: aura-vault-wasm-pr-${{ github.event.number }}
          path: aura-vault/target/wasm32-unknown-unknown/release/aura_vault.wasm
          retention-days: 7

  mobile-tests:
    name: Mobile Viewport Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []   # runs in parallel with lint / test / security / build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # ── Install root-level deps (Playwright lives here) ──────────────────
      - name: Install root dependencies
        run: npm ci

      # ── Install Playwright browsers (Chromium only – mobile projects use it) ─
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── Install & build the Next.js frontend ────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx next build
        env:
          # Disable Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"

      # ── Start the frontend dev server in the background ─────────────────
      - name: Start frontend server
        working-directory: frontend
        run: npx next start --port 3000 &
        env:
          NODE_ENV: production

      # ── Wait for the server to be ready ─────────────────────────────────
      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      # ── Run Playwright mobile projects only ─────────────────────────────
      - name: Run Playwright mobile tests (375 / 390 / 414)
        run: |
          npx playwright test \
            --project=mobile-375 \
            --project=mobile-390 \
            --project=mobile-414
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      # ── Upload HTML report and screenshots on failure ────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-mobile-report-pr-${{ github.event.number }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-mobile-screenshots-pr-${{ github.event.number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

version: 2
updates:
  # ── npm: root (cypress, root-level package.json) ─────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      npm-root-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── npm: frontend (Next.js) ───────────────────────────────────────────────

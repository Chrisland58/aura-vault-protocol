# ─────────────────────────────────────────────────────────────────────────────
# 01-frontend-policy.yaml
#
# Frontend (Next.js) rules:
#   Ingress  – accept traffic from the ingress controller only (port 3000)
#   Egress   – reach the backend only (port 4000)
#              reach kube-dns for name resolution (UDP/TCP 53)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: aura-vault
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/part-of: aura-vault
spec:
  podSelector:
    matchLabels:
      app: frontend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from the ingress-nginx controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  egress:
    # Allow outbound to the backend on its HTTP port
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 4000

    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
